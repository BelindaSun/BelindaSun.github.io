<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wordle — Belinda Sun</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap');

*{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation;}
:root{
  --bg:#FDFCFA;
  --bg2:#F5F0E8;
  --bg3:#EDE7D9;
  --text:#1A1A18;
  --text2:#6B6860;
  --text3:#A8A59C;
  --border:rgba(44,44,42,0.15);
  --border2:rgba(44,44,42,0.25);
  --correct:#2D7A57;
  --correct-bg:#D6F0E4;
  --correct-border:#7DCCA8;
  --present:#8A6A1A;
  --present-bg:#F5E6B8;
  --present-border:#D4B95A;
  --absent:#6B6860;
  --absent-bg:#E8E3D8;
  --absent-border:rgba(44,44,42,0.2);
  --radius:6px;
  --radius-lg:10px;
}
body{
  font-family:'DM Mono',monospace;
  background:var(--bg);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* NAV */
.page-nav{
  width:100%;
  display:flex;align-items:center;justify-content:space-between;
  padding:1rem 2rem;
  border-bottom:0.5px solid var(--border);
  background:var(--bg);
}
.page-nav a{font-family:'DM Serif Display',serif;font-size:1rem;color:#3D2A5C;text-decoration:none;}
.page-nav .nav-right a{font-size:0.85rem;color:#7A5FA0;}

/* MAIN */
.container{
  width:100%;max-width:480px;
  padding:1.5rem 1rem 2rem;
  display:flex;flex-direction:column;align-items:center;gap:1.25rem;
}

/* HEADER */
.header{text-align:center;}
.header h1{
  font-family:'DM Serif Display',serif;
  font-size:2rem;color:var(--text);
  letter-spacing:-0.02em;
}
.header p{font-size:11px;color:var(--text3);margin-top:4px;letter-spacing:0.05em;text-transform:uppercase;}

/* STATUS BAR */
.status-bar{
  display:flex;align-items:center;gap:12px;
  font-size:12px;color:var(--text2);
  width:100%;
}
.streak{
  display:flex;align-items:center;gap:5px;
  background:var(--bg2);border:0.5px solid var(--border);
  border-radius:20px;padding:4px 10px;
  font-size:11px;
}
.streak-num{font-weight:500;color:var(--text);}
.new-game-btn{
  margin-left:auto;
  padding:5px 14px;
  border:0.5px solid var(--border2);
  border-radius:var(--radius);
  background:transparent;
  color:var(--text2);
  cursor:pointer;
  font-size:12px;
  font-family:'DM Mono',monospace;
  transition:background .15s;
}
.new-game-btn:hover{background:var(--bg2);}

/* GRID */
.grid{
  display:grid;
  grid-template-rows:repeat(6,1fr);
  gap:5px;
}
.row{display:flex;gap:5px;}
.tile{
  width:54px;height:54px;
  border:0.5px solid var(--border2);
  border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;
  font-family:'DM Mono',monospace;
  font-size:20px;font-weight:500;
  color:var(--text);
  background:var(--bg);
  transition:transform .1s;
  position:relative;
  overflow:hidden;
}
.tile.filled{
  border-color:var(--border2);
  animation:pop .1s ease;
}
.tile.correct{
  background:var(--correct-bg);
  border-color:var(--correct-border);
  color:var(--correct);
}
.tile.present{
  background:var(--present-bg);
  border-color:var(--present-border);
  color:var(--present);
}
.tile.absent{
  background:var(--absent-bg);
  border-color:var(--absent-border);
  color:var(--absent);
}
.tile.reveal{
  animation:flip .45s ease forwards;
}
.tile.shake{animation:shake .4s ease;}
.tile.bounce{animation:bounce .5s ease;}

@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes flip{
  0%{transform:rotateX(0);background:var(--bg);}
  49%{transform:rotateX(90deg);background:var(--bg);}
  50%{transform:rotateX(90deg);}
  100%{transform:rotateX(0);}
}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)}
  60%{transform:translateX(-4px)}
  80%{transform:translateX(4px)}
}
@keyframes bounce{
  0%,100%{transform:translateY(0)}
  40%{transform:translateY(-10px)}
  60%{transform:translateY(-5px)}
}

/* MESSAGE */
.message{
  font-size:13px;color:var(--text2);
  min-height:20px;text-align:center;
  letter-spacing:0.02em;
}
.message.win{color:var(--correct);font-weight:500;}
.message.lose{color:#A32D2D;}

/* KEYBOARD */
.keyboard{display:flex;flex-direction:column;gap:6px;width:100%;}
.kb-row{display:flex;justify-content:center;gap:5px;}
.key{
  height:44px;min-width:34px;padding:0 6px;
  border:0.5px solid var(--border2);
  border-radius:var(--radius);
  background:var(--bg2);
  color:var(--text);
  font-family:'DM Mono',monospace;
  font-size:13px;font-weight:500;
  cursor:pointer;
  transition:background .1s,transform .05s;
  display:flex;align-items:center;justify-content:center;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.key:active{transform:scale(0.94);}
.key.wide{min-width:52px;font-size:11px;}
.key.correct{background:var(--correct-bg);border-color:var(--correct-border);color:var(--correct);}
.key.present{background:var(--present-bg);border-color:var(--present-border);color:var(--present);}
.key.absent{background:var(--absent-bg);border-color:var(--absent-border);color:var(--absent);}

/* STATS PANEL */
.stats{
  width:100%;
  background:var(--bg2);
  border:0.5px solid var(--border);
  border-radius:var(--radius-lg);
  padding:1rem 1.25rem;
  display:none;
}
.stats.show{display:block;}
.stats h3{font-family:'DM Serif Display',serif;font-size:1rem;color:var(--text);margin-bottom:.75rem;}
.stats-row{display:flex;gap:16px;margin-bottom:.75rem;}
.stat{text-align:center;flex:1;}
.stat-num{font-size:1.5rem;font-weight:500;color:var(--text);}
.stat-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;margin-top:2px;}
.dist{display:flex;flex-direction:column;gap:3px;}
.dist-row{display:flex;align-items:center;gap:6px;font-size:11px;}
.dist-label{width:10px;color:var(--text2);text-align:right;}
.dist-bar-wrap{flex:1;background:var(--bg3);border-radius:2px;height:14px;overflow:hidden;}
.dist-bar{height:100%;background:var(--border2);border-radius:2px;min-width:4px;transition:width .5s ease;display:flex;align-items:center;padding-left:5px;font-size:10px;color:var(--text2);}
.dist-bar.cur{background:var(--correct-bg);color:var(--correct);}


/* HOW TO PLAY */
.howto{width:100%;}
.howto h3{font-family:'DM Serif Display',serif;font-size:1rem;color:var(--text);margin-bottom:.75rem;}
.howto p{font-size:12px;color:var(--text2);margin-bottom:.75rem;line-height:1.6;}
.howto strong{color:var(--text);}
.howto-examples{display:flex;flex-direction:column;gap:.75rem;}
.howto-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.howto-row p{font-size:12px;color:var(--text2);margin:0;line-height:1.5;}
.ex-tile{
  width:34px;height:34px;
  border:0.5px solid var(--border2);
  border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;
  font-family:'DM Mono',monospace;font-size:14px;font-weight:500;
  color:var(--text);background:var(--bg);
}
.ex-tile.correct{background:var(--correct-bg);border-color:var(--correct-border);color:var(--correct);}
.ex-tile.present{background:var(--present-bg);border-color:var(--present-border);color:var(--present);}
.ex-tile.absent{background:var(--absent-bg);border-color:var(--absent-border);color:var(--absent);}

/* DIVIDER */
.divider{width:100%;height:0.5px;background:var(--border);}

@media(max-width:400px){
  .tile{width:46px;height:46px;font-size:17px;}
  .key{height:40px;min-width:29px;font-size:12px;}
  .key.wide{min-width:44px;}

var ALL_VALID = new Set(WORDS.concat(EXTRA));

// ── 状态 ──────────────────────────────────────────────────────────────────────
var answer = '';
var guesses = [];       // 已提交的猜测
var current = '';       // 当前输入
var gameOver = false;
var stats = loadStats();

// ── 初始化 ────────────────────────────────────────────────────────────────────
function init() {
  buildGrid();
  buildKeyboard();
  newGame();
  document.addEventListener('keydown', onKeyDown);
}

function newGame() {
  answer = WORDS[Math.floor(Math.random() * WORDS.length)];
  guesses = [];
  current = '';
  gameOver = false;
  setMessage('');
  document.getElementById('stats').classList.remove('show');
  renderGrid();
  renderKeyboard();
}

// ── 网格 ──────────────────────────────────────────────────────────────────────
function buildGrid() {
  var g = document.getElementById('grid');
  g.innerHTML = '';
  for (var r = 0; r < 6; r++) {
    var row = document.createElement('div');
    row.className = 'row';
    row.id = 'row-' + r;
    for (var c = 0; c < 5; c++) {
      var tile = document.createElement('div');
      tile.className = 'tile';
      tile.id = 'tile-' + r + '-' + c;
      row.appendChild(tile);
    }
    g.appendChild(row);
  }
}

function renderGrid() {
  for (var r = 0; r < 6; r++) {
    for (var c = 0; c < 5; c++) {
      var tile = document.getElementById('tile-' + r + '-' + c);
      tile.textContent = '';
      tile.className = 'tile';
    }
  }
  // 已提交的行
  guesses.forEach(function(guess, r) {
    var result = score(guess);
    for (var c = 0; c < 5; c++) {
      var tile = document.getElementById('tile-' + r + '-' + c);
      tile.textContent = guess[c];
      tile.className = 'tile ' + result[c];
    }
  });
  // 当前输入行
  var row = guesses.length;
  if (row < 6 && !gameOver) {
    for (var c = 0; c < 5; c++) {
      var tile = document.getElementById('tile-' + row + '-' + c);
      tile.textContent = current[c] || '';
      tile.className = 'tile' + (current[c] ? ' filled' : '');
    }
  }
}

// ── 键盘 ──────────────────────────────────────────────────────────────────────
var ROWS = [
  ['Q','W','E','R','T','Y','U','I','O','P'],
  ['A','S','D','F','G','H','J','K','L'],
  ['ENTER','Z','X','C','V','B','N','M','⌫']
];

function buildKeyboard() {
  var kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  ROWS.forEach(function(row) {
    var rowEl = document.createElement('div');
    rowEl.className = 'kb-row';
    row.forEach(function(k) {
      var btn = document.createElement('button');
      btn.className = 'key' + (k.length > 1 ? ' wide' : '');
      btn.textContent = k;
      btn.id = 'key-' + k;
      btn.setAttribute('data-key', k);
      btn.onclick = function() { handleKey(k); };
      rowEl.appendChild(btn);
    });
    kb.appendChild(rowEl);
  });
}

function renderKeyboard() {
  // 先清掉所有颜色
  document.querySelectorAll('.key').forEach(function(k) {
    k.classList.remove('correct', 'present', 'absent');
  });
  // 根据已猜历史着色（correct > present > absent 优先级）
  var state = {};
  guesses.forEach(function(guess) {
    var result = score(guess);
    for (var i = 0; i < 5; i++) {
      var letter = guess[i];
      var cur = state[letter];
      if (result[i] === 'correct') state[letter] = 'correct';
      else if (result[i] === 'present' && cur !== 'correct') state[letter] = 'present';
      else if (!cur) state[letter] = 'absent';
    }
  });
  Object.keys(state).forEach(function(letter) {
    var el = document.getElementById('key-' + letter);
    if (el) el.classList.add(state[letter]);
  });
}

// ── 输入处理 ──────────────────────────────────────────────────────────────────
function onKeyDown(e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Enter') handleKey('ENTER');
  else if (e.key === 'Backspace') handleKey('⌫');
  else if (/^[a-zA-Z]$/.test(e.key)) handleKey(e.key.toUpperCase());
}

function handleKey(k) {
  if (gameOver) return;
  if (k === '⌫') {
    current = current.slice(0, -1);
    renderGrid();
  } else if (k === 'ENTER') {
    submit();
  } else if (current.length < 5) {
    current += k;
    renderGrid();
    // 弹跳动画
    var row = guesses.length;
    var tile = document.getElementById('tile-' + row + '-' + (current.length - 1));
    tile.classList.remove('filled');
    void tile.offsetWidth;
    tile.classList.add('filled');
  }
}

function submit() {
  if (current.length < 5) {
    shakeRow(guesses.length);
    setMessage('Not enough letters');
    setTimeout(function() { setMessage(''); }, 1200);
    return;
  }
  // 用免费词典 API 验证是否为真实英文单词
  setMessage('...');
  var word = current;
  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + word.toLowerCase())
    .then(function(r) {
      setMessage('');
      if (!r.ok) {
        shakeRow(guesses.length);
        setMessage('Not a real word');
        setTimeout(function() { setMessage(''); }, 1400);
      } else {
        doSubmit(word);
      }
    })
    .catch(function() {
      // 网络失败时直接放行，不影响游戏
      setMessage('');
      doSubmit(word);
    });
}

function doSubmit(word) {
  var row = guesses.length;
  var result = score(word);
  guesses.push(word);
  current = '';

  // 翻转动画
  revealRow(row, result, function() {
    renderKeyboard();
    var won = result.every(function(r) { return r === 'correct'; });
    if (won) {
      gameOver = true;
      stats.played++;
      stats.wins++;
      stats.streak++;
      stats.best = Math.max(stats.best, stats.streak);
      stats.dist[row] = (stats.dist[row] || 0) + 1;
      saveStats();
      bounceRow(row);
      var msgs = ['Genius!', 'Magnificent!', 'Impressive!', 'Splendid!', 'Great!', 'Phew!'];
      setTimeout(function() {
        setMessage(msgs[row] || 'Nice!', 'win');
        showStats(row);
        document.getElementById('streak-num').textContent = stats.streak;
      }, 400);
    } else if (guesses.length === 6) {
      gameOver = true;
      stats.played++;
      stats.streak = 0;
      saveStats();
      setTimeout(function() {
        setMessage('The word was ' + answer, 'lose');
        showStats(-1);
        document.getElementById('streak-num').textContent = stats.streak;
      }, 400);
    }
  });
}

// ── 评分 ──────────────────────────────────────────────────────────────────────
function score(guess) {
  var result = ['absent', 'absent', 'absent', 'absent', 'absent'];
  var ansArr = answer.split('');
  var gArr = guess.split('');
  // 先标 correct
  for (var i = 0; i < 5; i++) {
    if (gArr[i] === ansArr[i]) {
      result[i] = 'correct';
      ansArr[i] = null;
      gArr[i] = null;
    }
  }
  // 再标 present
  for (var i = 0; i < 5; i++) {
    if (gArr[i] === null) continue;
    var idx = ansArr.indexOf(gArr[i]);
    if (idx !== -1) {
      result[i] = 'present';
      ansArr[idx] = null;
    }
  }
  return result;
}

// ── 动画 ──────────────────────────────────────────────────────────────────────
function revealRow(row, result, cb) {
  var delay = 0;
  for (var c = 0; c < 5; c++) {
    (function(col, d) {
      var tile = document.getElementById('tile-' + row + '-' + col);
      setTimeout(function() {
        tile.classList.add('reveal');
        // 翻到一半时换颜色
        setTimeout(function() {
          tile.classList.remove('reveal');
          tile.classList.add(result[col]);
        }, 225);
      }, d);
    })(c, delay);
    delay += 100;
  }
  setTimeout(cb, delay + 300);
}

function shakeRow(row) {
  var rowEl = document.getElementById('row-' + row);
  rowEl.classList.remove('shake');
  void rowEl.offsetWidth;
  rowEl.classList.add('shake');
  setTimeout(function() { rowEl.classList.remove('shake'); }, 400);
}

function bounceRow(row) {
  var delay = 0;
  for (var c = 0; c < 5; c++) {
    (function(col, d) {
      setTimeout(function() {
        var tile = document.getElementById('tile-' + row + '-' + col);
        tile.classList.add('bounce');
        setTimeout(function() { tile.classList.remove('bounce'); }, 500);
      }, d);
    })(c, delay);
    delay += 80;
  }
}

// ── UI ────────────────────────────────────────────────────────────────────────
function setMessage(txt, cls) {
  var el = document.getElementById('message');
  el.textContent = txt;
  el.className = 'message' + (cls ? ' ' + cls : '');
}

function showStats(winRow) {
  var s = stats;
  document.getElementById('s-played').textContent = s.played;
  document.getElementById('s-win').textContent = s.played ? Math.round(s.wins / s.played * 100) + '%' : '0%';
  document.getElementById('s-streak').textContent = s.streak;
  document.getElementById('s-max').textContent = s.best;
  // 分布图
  var dist = document.getElementById('dist');
  dist.innerHTML = '';
  var maxVal = Math.max.apply(null, Object.values(s.dist).concat([1]));
  for (var i = 0; i < 6; i++) {
    var val = s.dist[i] || 0;
    var row = document.createElement('div');
    row.className = 'dist-row';
    var pct = Math.round(val / maxVal * 100);
    row.innerHTML = '<span class="dist-label">' + (i + 1) + '</span>'
      + '<div class="dist-bar-wrap"><div class="dist-bar' + (i === winRow ? ' cur' : '') + '" style="width:' + Math.max(pct, 4) + '%">' + (val || '') + '</div></div>';
    dist.appendChild(row);
  }
  setTimeout(function() {
    document.getElementById('stats').classList.add('show');
  }, 600);
}

// ── 持久化 ────────────────────────────────────────────────────────────────────
function loadStats() {
  try {
    var s = JSON.parse(localStorage.getItem('wordle-stats') || 'null');
    if (s) return s;
  } catch(e) {}
  return { played: 0, wins: 0, streak: 0, best: 0, dist: {} };
}
function saveStats() {
  try { localStorage.setItem('wordle-stats', JSON.stringify(stats)); } catch(e) {}
}

init();
document.getElementById('streak-num').textContent = stats.streak;

// 防止 iOS 双击缩放
var lastTap = 0;
document.addEventListener('touchend', function(e) {
  var now = Date.now();
  if (now - lastTap < 300) e.preventDefault();
  lastTap = now;
}, {passive: false});
</script>
